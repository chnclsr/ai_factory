<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hooks-title hooks-desc" id="ai-factory-hooks-lifecycle-root">
        <title id="hooks-title">AI Factory · Plugin Hooks Lifecycle and Safety Enforcement</title>
        <desc id="hooks-desc">Sequence diagram showing tool interception, safety blocks on folder deletion and direct Claude calls, and legitimate router dispatch.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ai-factory-hooks-lifecycle-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ai-factory-hooks-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ai-factory-hooks-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ai-factory-hooks-lifecycle-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="ai-factory-hooks-lifecycle-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="ai-factory-hooks-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="ai-factory-hooks-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="ai-factory-hooks-lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#ai-factory-hooks-lifecycle-dots)" opacity="0.55"/>

        <!-- Lifelines: x=140, 380, 620, 860 -->
        <line x1="140" y1="104" x2="140" y2="490" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="380" y1="104" x2="380" y2="490" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="620" y1="104" x2="620" y2="490" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="860" y1="104" x2="860" y2="490" stroke="#2d3142" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- Activation Bars -->
        <!-- Hook Check 1 (Deny Delete) -->
        <rect x="376" y="148" width="8" height="32" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <!-- Hook Check 2 (Deny Claude Direct) -->
        <rect x="376" y="196" width="8" height="32" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <!-- Hook Check 3 (Allow Router) -->
        <rect x="376" y="296" width="8" height="32" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>
        <!-- Router Run (Focal Coral) -->
        <rect x="616" y="344" width="8" height="116" fill="#bf4520" stroke="#bf4520" stroke-width="0.8" fill-opacity="0.06"/>
        <!-- Engine Exec -->
        <rect x="856" y="376" width="8" height="48" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.06"/>

        <!-- Section 1: Forbidden Invocations Blocked -->
        <!-- 1. Agent -> Hook: Attempt Folder Delete -->
        <line x1="140" y1="152" x2="376" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ai-factory-hooks-lifecycle-arrow)"/>
        <!-- 2. Hook -> Agent: DENY Delete -->
        <line x1="376" y1="176" x2="140" y2="176" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ai-factory-hooks-lifecycle-arrow-accent)"/>

        <!-- 3. Agent -> Hook: Attempt Direct Claude -->
        <line x1="140" y1="200" x2="376" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ai-factory-hooks-lifecycle-arrow)"/>
        <!-- 4. Hook -> Agent: DENY Claude Direct -->
        <line x1="376" y1="224" x2="140" y2="224" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ai-factory-hooks-lifecycle-arrow-accent)"/>

        <!-- Divider Band: Allowed Workflow -->
        <rect x="60" y="254" width="880" height="20" rx="4" fill="#2d3142" stroke="#2d3142" stroke-width="0.6" fill-opacity="0.03" stroke-opacity="0.12"/>
        <text x="500" y="268" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALLOWED: ROUTED DELEGATION VIA ROUTER.MJS</text>

        <!-- Section 2: Allowed Router Workflow -->
        <!-- 5. Agent -> Hook: PreToolUse check router.mjs -->
        <line x1="140" y1="300" x2="376" y2="300" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ai-factory-hooks-lifecycle-arrow-link)"/>
        <!-- 6. Hook -> Agent: ALLOW -->
        <line x1="376" y1="324" x2="140" y2="324" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ai-factory-hooks-lifecycle-arrow)"/>

        <!-- 7. Agent -> Router: Spawn Process -->
        <line x1="140" y1="348" x2="616" y2="348" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ai-factory-hooks-lifecycle-arrow-accent)"/>
        <!-- 8. Router -> Child Engine: Spawn CLI -->
        <line x1="624" y1="380" x2="856" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ai-factory-hooks-lifecycle-arrow)"/>
        <!-- 9. Child Engine -> Router: Stdout + Exit -->
        <line x1="856" y1="420" x2="624" y2="420" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ai-factory-hooks-lifecycle-arrow)"/>
        <!-- 10. Router -> Agent: Execution Report -->
        <line x1="616" y1="456" x2="140" y2="456" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ai-factory-hooks-lifecycle-arrow-accent)"/>

        <!-- Arrow Labels (with opaque paper masks) -->
        <rect x="200" y="140" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="149" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN: RMDIR / REMOVE-ITEM</text>

        <rect x="180" y="164" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="173" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DENIED: FOLDER DELETION GUARD</text>

        <rect x="200" y="188" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="197" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN: CLAUDE -P DIRECT</text>

        <rect x="176" y="212" width="168" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="221" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DENIED: MUST ROUTE VIA ROUTER</text>

        <rect x="190" y="288" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="297" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN: NODE ROUTER.MJS</text>

        <rect x="200" y="312" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="260" y="321" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALLOWED: SAFE POLICY</text>

        <rect x="330" y="336" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="345" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTE ROUTER COMMAND</text>

        <rect x="680" y="368" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="377" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHILD INVOCATION</text>

        <rect x="670" y="408" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="417" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STREAM CAPTURE + STATUS</text>

        <rect x="330" y="444" width="140" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="453" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI FACTORY REPORT</text>

        <!-- Actor Headers (top row) -->
        <!-- Actor 1: Antigravity Agent -->
        <rect x="60" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="48" width="160" height="56" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.08"/>
        <rect x="68" y="56" width="30" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="83" y="65" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="140" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Antigravity Agent</text>
        <text x="140" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Caller / Workspace</text>

        <!-- Actor 2: Plugin Hooks -->
        <rect x="300" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="48" width="160" height="56" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="308" y="56" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="325" y="65" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
        <text x="380" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plugin Hooks</text>
        <text x="380" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pre_tool_use.py</text>

        <!-- Actor 3: Router Core (Focal Coral) -->
        <rect x="540" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="48" width="160" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="548" y="56" width="38" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="567" y="65" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
        <text x="620" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Factory Router</text>
        <text x="620" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">router.mjs Watchdog</text>

        <!-- Actor 4: Child Process / Engine -->
        <rect x="780" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="788" y="56" width="38" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="807" y="65" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHILD</text>
        <text x="860" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Engine Child</text>
        <text x="860" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">vibe · muse · claude</text>

        <!-- Legend strip -->
        <line x1="40" y1="520" x2="950" y2="520" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="120" y1="533" x2="144" y2="533" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ai-factory-hooks-lifecycle-arrow-link)"/>
        <text x="152" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tool call dispatch</text>

        <line x1="280" y1="533" x2="304" y2="533" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ai-factory-hooks-lifecycle-arrow-accent)"/>
        <text x="312" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Guard denial / Report</text>

        <line x1="480" y1="533" x2="504" y2="533" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ai-factory-hooks-lifecycle-arrow)"/>
        <text x="512" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Allowed lifecycle execution</text>
      </svg>
