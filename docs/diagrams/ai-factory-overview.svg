<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc" id="ai-factory-overview-root">
        <title id="overview-title">AI Factory · System Architecture Overview</title>
        <desc id="overview-desc">Architecture diagram showing Antigravity agent interactions routed through plugin hooks and router.mjs to execution engines and SQLite memory.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ai-factory-overview-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ai-factory-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ai-factory-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ai-factory-overview-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="ai-factory-overview-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="ai-factory-overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="ai-factory-overview-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="ai-factory-overview-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#ai-factory-overview-dots)" opacity="0.55"/>

        <!-- Zones: Container scopes -->
        <!-- Core Routing Scope -->
        <rect x="444" y="80" width="480" height="312" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="464" y="84" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="93" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em" fill-opacity="0.45">ROUTER RUNTIME</text>

        <!-- Arrows first (behind boxes) -->
        <!-- Antigravity -> Hooks -->
        <line x1="184" y1="236" x2="244" y2="236" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ai-factory-overview-arrow-link)"/>

        <!-- Hooks -> Router -->
        <line x1="388" y1="236" x2="464" y2="236" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ai-factory-overview-arrow-accent)"/>

        <!-- Router -> Engines (Upper branch) -->
        <path d="M 624,220 H 668 Q 676,220 676,212 V 152 Q 676,144 684,144 H 708"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ai-factory-overview-arrow)"/>

        <!-- Engines -> Router (Return upper branch) -->
        <path d="M 708,168 H 652 Q 644,168 644,176 V 204"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ai-factory-overview-arrow)"/>

        <!-- Router -> Memory (Lower branch) -->
        <path d="M 624,252 H 668 Q 676,252 676,260 V 320 Q 676,328 684,328 H 708"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ai-factory-overview-arrow)"/>

        <!-- Memory -> Router (Context return) -->
        <path d="M 708,344 H 652 Q 644,344 644,336 V 268"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ai-factory-overview-arrow)"/>

        <!-- Return: Router -> Antigravity via bottom channel -->
        <path d="M 544,272 V 400 Q 544,408 536,408 H 120 Q 112,408 112,400 V 272"
              fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ai-factory-overview-arrow-accent)"/>

        <!-- Arrow labels with masks -->
        <rect x="188" y="224" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="233" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREFIX</text>

        <rect x="396" y="224" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="426" y="233" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRE-TOOL</text>

        <rect x="670" y="132" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="687" y="141" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>

        <rect x="670" y="316" width="34" height="12" rx="2" fill="#f5f5f5"/>
        <text x="687" y="325" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>

        <rect x="296" y="402" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="334" y="411" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT</text>

        <!-- Nodes -->
        <!-- Node 1: Antigravity UI / Agent -->
        <rect x="40" y="200" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="200" width="144" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.08"/>
        <rect x="48" y="208" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="64" y="217" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="112" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Antigravity</text>
        <text x="112" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Agent / Chat UI</text>

        <!-- Node 2: Plugin Hooks -->
        <rect x="244" y="200" width="144" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="244" y="200" width="144" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="252" y="208" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="269" y="217" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
        <text x="316" y="237" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plugin Hooks</text>
        <text x="316" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">PreToolUse / Safe</text>

        <!-- Node 3: AI Factory Router (Focal Coral) -->
        <rect x="464" y="200" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="464" y="200" width="160" height="72" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="472" y="208" width="38" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="491" y="217" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="614" y="262" fill="#bf4520" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end" fill-opacity="0.12">01</text>
        <text x="544" y="237" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router Core</text>
        <text x="544" y="254" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">router.mjs · Watchdog</text>

        <!-- Node 4: Execution Engines -->
        <rect x="716" y="112" width="180" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="112" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="724" y="120" width="44" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="746" y="129" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINES</text>
        <text x="806" y="149" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM Engines</text>
        <text x="806" y="166" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Vibe · Muse · Claude</text>

        <!-- Node 5: Project Memory -->
        <rect x="716" y="288" width="180" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="288" width="180" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="724" y="296" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="744" y="305" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="806" y="325" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Project Memory</text>
        <text x="806" y="342" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">ai_factory.db · SQLite</text>

        <!-- Legend strip -->
        <line x1="40" y1="440" x2="924" y2="440" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="110" y="448" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="130" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core router</text>

        <rect x="230" y="448" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="250" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Execution engine</text>

        <rect x="380" y="448" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="400" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SQLite persistence</text>

        <line x1="530" y1="453" x2="554" y2="453" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ai-factory-overview-arrow-link)"/>
        <text x="562" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inbound task</text>

        <line x1="660" y1="453" x2="684" y2="453" stroke="#bf4520" stroke-width="1.4" marker-end="url(#ai-factory-overview-arrow-accent)"/>
        <text x="692" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary dispatch / report</text>

        <line x1="840" y1="453" x2="864" y2="453" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ai-factory-overview-arrow)"/>
        <text x="872" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Context / Async</text>
      </svg>
