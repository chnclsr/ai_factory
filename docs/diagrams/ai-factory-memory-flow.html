<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Factory · Memory Layer</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Memory Layer — Git-Backed Cross-Call Continuity</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-flow-title memory-flow-desc">
        <title id="memory-flow-title">AI Factory Memory Layer — git-backed continuity</title>
        <desc id="memory-flow-desc">The AI Factory router calls the memory layer's three APIs on every invocation; each turn is committed with CAS to the project's chain in a central bare git repository, the SQLite FTS index is derived from it, and the plugin hooks inject context at SessionStart and record engine turns at Stop.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (before arrows and nodes) -->
        <rect x="336" y="96" width="672" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="352" y="100" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="428" y="110" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUNTIME · NODE.JS PROCESS</text>

        <rect x="336" y="520" width="672" height="144" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="352" y="524" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="432" y="534" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PERSISTENT LAYER · DATA_DIR</text>

        <!-- Arrows (before nodes) -->
        <!-- A1: Agent -> Router, task -->
        <line x1="248" y1="212" x2="384" y2="212" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- A2: Router -> Engine, primary path -->
        <line x1="584" y1="212" x2="1048" y2="212" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- A3: Engine -> Router, reply (dashed) -->
        <line x1="1048" y1="252" x2="584" y2="252" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- A4: Router -> Agent, report (dashed) -->
        <line x1="384" y1="252" x2="248" y2="252" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- A5: Router -> Memory, three API calls -->
        <line x1="444" y1="264" x2="444" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- A6: Hooks -> Memory, record-agy (dashed) -->
        <line x1="736" y1="380" x2="604" y2="380" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- A7: Memory -> Git, commit (CAS) -->
        <line x1="420" y1="424" x2="420" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- A8: Git -> Memory, read with no git process (dashed) -->
        <line x1="464" y1="560" x2="464" y2="424" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- A9: Memory -> SQLite, index and search -->
        <path d="M 560,424 V 488 Q 560,496 568,496 H 840 Q 848,496 848,504 V 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (masks, then text) -->
        <rect x="294" y="192" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="316" y="202" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TASK</text>

        <rect x="780" y="192" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="816" y="202" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT+CTX</text>

        <rect x="786" y="226" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="808" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPLY</text>

        <rect x="290" y="226" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="314" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPORT</text>

        <rect x="457" y="288" width="78" height="12" rx="2" fill="#f5f5f5"/>
        <text x="496" y="298" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 API CALLS</text>

        <rect x="634" y="360" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="670" y="370" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORD-AGY</text>

        <rect x="340" y="476" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="376" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMIT·CAS</text>

        <rect x="472" y="492" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="502" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ·NO GIT</text>

        <rect x="660" y="476" width="86" height="12" rx="2" fill="#f5f5f5"/>
        <text x="703" y="486" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INDEX·SEARCH</text>

        <!-- Nodes (after arrows) -->
        <!-- Antigravity Agent — input -->
        <rect x="48" y="176" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="176" width="200" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="56" y="182" width="30" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="71" y="191" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="148" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Antigravity Agent</text>
        <text x="148" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CLI · Web client</text>

        <!-- AI Factory Router — backend -->
        <rect x="384" y="176" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="176" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="182" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="413" y="191" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
        <text x="484" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Factory Router</text>
        <text x="484" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/router.mjs</text>

        <!-- Memory Layer — backend -->
        <rect x="364" y="336" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="364" y="336" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="372" y="342" width="68" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="406" y="351" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY API</text>
        <text x="484" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory Layer</text>
        <text x="484" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolveSession · buildPrompt</text>
        <text x="484" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recordTurn</text>

        <!-- Target Engines — external -->
        <rect x="1048" y="176" width="200" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="1048" y="176" width="200" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1056" y="182" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="1077" y="191" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
        <text x="1148" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Target Engines</text>
        <text x="1148" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vibe · Muse · OpenCode</text>

        <!-- Plugin Hooks — optional/async -->
        <rect x="736" y="336" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="336" width="240" height="88" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="744" y="342" width="42" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="765" y="351" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOKS</text>
        <text x="856" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plugin Hooks</text>
        <text x="856" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SessionStart: injects context</text>
        <text x="856" y="410" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Stop: record-agy</text>

        <!-- Bare Git Repository — focal -->
        <rect x="384" y="560" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="560" width="240" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="392" y="566" width="66" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="425" y="575" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY.GIT</text>
        <text x="504" y="602" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bare Git Repository</text>
        <text x="504" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">refs/heads/p/&lt;project&gt;</text>
        <text x="504" y="634" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ordered commit chain · CAS</text>

        <!-- SQLite Index — store -->
        <rect x="736" y="560" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="560" width="240" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="744" y="566" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="760" y="575" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FTS5</text>
        <text x="856" y="602" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite Index</text>
        <text x="856" y="620" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">memory-index.sqlite</text>
        <text x="856" y="634" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">derived · FTS5 search</text>

        <!-- Legend -->
        <line x1="48" y1="680" x2="1232" y2="680" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="48" y="700" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="160" y1="697" x2="188" y2="697" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="196" y="700" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Task submission</text>

        <line x1="360" y1="697" x2="388" y2="697" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="396" y="700" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Context-enriched execution — primary path</text>

        <line x1="640" y1="697" x2="668" y2="697" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="676" y="700" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Memory calls</text>

        <line x1="860" y1="697" x2="888" y2="697" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="896" y="700" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Reply · read-only lookup</text>
      </svg>
    </div>
  </div>
</body>
</html>
