<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Factory · Project Memory Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>AI Factory · Project Memory and Session Continuity</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-title memory-desc">
        <title id="memory-title">AI Factory · Project Memory and Session Continuity</title>
        <desc id="memory-desc">Sequence diagram showing session continuity, turn recording in SQLite, and context restoration across multi-turn workflows.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Lifelines: x=120, 370, 620, 870 -->
        <line x1="120" y1="104" x2="120" y2="490" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="370" y1="104" x2="370" y2="490" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="620" y1="104" x2="620" y2="490" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="870" y1="104" x2="870" y2="490" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation Bars -->
        <!-- Router Turn 1 -->
        <rect x="366" y="148" width="8" height="232" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="0.8"/>
        <!-- Memory Read Turn 1 -->
        <rect x="866" y="184" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Engine Run Turn 1 -->
        <rect x="616" y="244" width="8" height="48" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- Memory Write Turn 1 -->
        <rect x="866" y="324" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Router Turn 2 -->
        <rect x="366" y="440" width="8" height="50" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="0.8"/>

        <!-- Message Lines (drawn before labels) -->
        <!-- 1. User -> Router: Task 1 -->
        <line x1="120" y1="152" x2="366" y2="152" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 2. Router -> Memory: Load History -->
        <line x1="374" y1="188" x2="866" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 3. Memory -> Router: Recent Turns -->
        <line x1="866" y1="216" x2="374" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 4. Router -> Engine: Prompt + Context -->
        <line x1="374" y1="248" x2="616" y2="248" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 5. Engine -> Router: Result -->
        <line x1="616" y1="288" x2="374" y2="288" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- 6. Router -> Memory: Record Turn 1 -->
        <line x1="374" y1="328" x2="866" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 7. Router -> User: Execution Report -->
        <line x1="366" y1="376" x2="120" y2="376" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- Divider Band: Turn 2 Continuation -->
        <rect x="60" y="404" width="880" height="20" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="0.6"/>
        <text x="500" y="418" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NEXT TURN IN SAME SESSION (CARRIES PRIOR CONTEXT)</text>

        <!-- 8. User -> Router: Task 2 -->
        <line x1="120" y1="444" x2="366" y2="444" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- 9. Router -> Memory: Fetch Context -->
        <line x1="374" y1="464" x2="866" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 10. Router -> Engine: Full History -->
        <line x1="374" y1="486" x2="616" y2="486" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow Labels (with opaque paper masks) -->
        <rect x="184" y="140" width="118" height="12" rx="2" fill="#f5f5f5"/>
        <text x="243" y="149" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TASK 1 (--SESSION S1)</text>

        <rect x="548" y="176" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="185" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD SESSION TURNS (S1)</text>

        <rect x="548" y="204" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="213" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECENT TURNS CONTEXT</text>

        <rect x="432" y="236" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="494" y="245" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROMPT + MEMORY CTX</text>

        <rect x="432" y="276" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="494" y="285" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STDOUT / MODIFIED FILES</text>

        <rect x="548" y="316" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="325" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RECORD TURN 1 IN SQLITE</text>

        <rect x="180" y="364" width="126" height="12" rx="2" fill="#f5f5f5"/>
        <text x="243" y="373" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTION REPORT (TURN 1)</text>

        <rect x="184" y="432" width="118" height="12" rx="2" fill="#f5f5f5"/>
        <text x="243" y="441" fill="#2e5aa8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TASK 2 (--SESSION S1)</text>

        <rect x="548" y="452" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="461" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESTORE TURN 1 MEMORY</text>

        <rect x="432" y="474" width="124" height="12" rx="2" fill="#f5f5f5"/>
        <text x="494" y="483" fill="#bf4520" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN WITH ACCUMULATED CTX</text>

        <!-- Actor Headers (top row) -->
        <!-- Actor 1: User / Host -->
        <rect x="40" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="48" width="160" height="56" rx="6" fill="rgba(79,93,117,0.08)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="56" width="30" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="63" y="65" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="120" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Antigravity Agent</text>
        <text x="120" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CLI or Web Client</text>

        <!-- Actor 2: Router Core (Focal Coral) -->
        <rect x="290" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="290" y="48" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="298" y="56" width="38" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="317" y="65" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTER</text>
        <text x="370" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Factory Router</text>
        <text x="370" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">router.mjs Core</text>

        <!-- Actor 3: LLM Engine -->
        <rect x="540" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="548" y="56" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="568" y="65" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
        <text x="620" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Target Engine</text>
        <text x="620" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Vibe · Muse · Claude</text>

        <!-- Actor 4: Project Memory -->
        <rect x="790" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="790" y="48" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="798" y="56" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="818" y="65" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY</text>
        <text x="870" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Project Memory</text>
        <text x="870" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ai_factory.db · SQLite</text>

        <!-- Legend strip -->
        <line x1="40" y1="520" x2="950" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="120" y1="533" x2="144" y2="533" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="152" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Task submission</text>

        <line x1="280" y1="533" x2="304" y2="533" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="312" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Context-enriched execution</text>

        <line x1="490" y1="533" x2="514" y2="533" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="522" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Memory read / write</text>

        <line x1="680" y1="533" x2="704" y2="533" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="712" y="536" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Response return</text>
      </svg>
    </div>
  </div>
</body>
</html>
